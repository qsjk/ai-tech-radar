# Configuration d'Alembic (III §10.5, docs/database.md §5).
# Aucune URL ici : migrations/env.py construit l'URL à partir de RADAR_DB_PATH, fixée par Compose (architecture.md P-01).
# Pas de section de logging : les logs de migrate relèvent de VII §42.1.

[alembic]
script_location = %(here)s/migrations
prepend_sys_path = .
path_separator = os
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s
