# Alembic configuration (III §10.5, docs/database.md §5).
# No URL here: migrations/env.py builds the URL from RADAR_DB_PATH, set by Compose (architecture.md P-01).
# No logging section: migrate logs fall under VII §42.1.

[alembic]
script_location = %(here)s/migrations
prepend_sys_path = .
path_separator = os
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s
