# Entity dictionary: minimal demo set (Sprint 1, decision Q-04).
# Format: IV §16.4. Aliases are declared here, never in the database (CF-19).
entities:
  - type: company
    canonical_name: anthropic
    name: Anthropic
  - type: product
    canonical_name: claude-code
    name: Claude Code
    aliases: ["claude code", "claude-code"]
  - type: model
    canonical_name: claude-opus
    name: Claude Opus
    aliases: [{ term: 'claude[ -]?opus', regex: true }]

github_reserved_paths:   # first github.com URL segments that are not owners
  [orgs, topics, settings, features, marketplace, sponsors, collections, trending,
   explore, about, pricing, login, join, notifications, search, apps, enterprise]
