# CI minimale du Sprint 1 (T1.1) : étapes 1 (statique) et 4 (tests) de VIII §49.2.
# Complétée jusqu'aux six étapes par T1.11 (VIII §49, docs/architecture.md §5.1).
name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_VERSION: "0.12.18"
  PYTHON_VERSION: "3.12"

jobs:
  statique:
    name: "1 · Statique"
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Dépendances (uv.lock)
        run: uv sync --locked
      - name: ruff check
        run: uv run ruff check
      - name: ruff format --check
        run: uv run ruff format --check
      - name: mypy (strict sur app/)
        run: uv run mypy

  tests:
    name: "4 · Tests"
    needs: statique
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Dépendances (uv.lock)
        run: uv sync --locked
      - name: pytest (réseau bloqué, VIII §50.1), couverture de app/ dans le résumé du job
        run: uv run pytest --cov-report=markdown-append:"$GITHUB_STEP_SUMMARY"
