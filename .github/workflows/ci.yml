# Minimal Sprint 1 CI (T1.1): stages 1 (static) and 4 (tests) of VIII §49.2.
# Completed up to the six stages by T1.11 (VIII §49, docs/architecture.md §5.1).
# Job names keep the stage names of VIII §49.2 and docs/architecture.md §5.1, as displayed in the checks.
name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_VERSION: "0.12.18"
  PYTHON_VERSION: "3.12"

jobs:
  static:
    name: "1 · Statique"
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Dependencies (uv.lock)
        run: uv sync --locked
      - name: ruff check
        run: uv run ruff check
      - name: ruff format --check
        run: uv run ruff format --check
      - name: mypy (strict on app/)
        run: uv run mypy
      - name: shellcheck (scripts/radar-dev)
        run: uv run shellcheck scripts/radar-dev

  tests:
    name: "4 · Tests"
    needs: static
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Dependencies (uv.lock)
        run: uv sync --locked
      - name: pytest (network blocked, VIII §50.1), app/ coverage in the job summary
        run: uv run pytest --cov-report=markdown-append:"$GITHUB_STEP_SUMMARY"
