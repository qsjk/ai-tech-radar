# Scheduled workflows (VIII §49.1; docs/architecture.md §5.1). Scheduled runs use the default branch, main.
# - nightly: stages 1 to 6 of ci.yml, e2e included;
# - weekly: stage 3 (audit) on the lockfiles of main;
# - monthly (1st of the month): images rebuilt without cache, base images pulled again (VII §43.2), then e2e.
name: scheduled

on:
  schedule:
    - cron: "17 2 * * *" # nightly, 02:17 UTC
    - cron: "43 4 * * 1" # weekly, Monday 04:43 UTC
    - cron: "29 3 1 * *" # monthly, 1st at 03:29 UTC

permissions:
  contents: read

jobs:
  nightly:
    if: github.event.schedule == '17 2 * * *'
    uses: ./.github/workflows/ci.yml
    with:
      e2e: true

  monthly:
    if: github.event.schedule == '29 3 1 * *'
    uses: ./.github/workflows/ci.yml
    with:
      e2e: true
      no_cache: true

  weekly-audit:
    name: "3 · Audit (weekly)"
    if: github.event.schedule == '43 4 * * 1'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.18"
          python-version: "3.12"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.21.0"
      - name: Dependencies (uv.lock)
        run: uv sync --locked
      - uses: ./.github/actions/audit
