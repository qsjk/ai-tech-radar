[project]
name = "ai-tech-radar"
version = "0.1.0"
description = "Technology watch radar: collection, clustering and trends (docs/spec/)."
readme = "README.md"
requires-python = "==3.12.*"
dependencies = [
    "aiosqlite==0.22.1",
    "alembic==1.20.0",
    "fastapi==0.141.1",
    "pydantic==2.13.5",
    "pydantic-settings==2.15.0",
    "pyyaml==6.0.3",
    "sqlalchemy==2.0.54",
    "structlog==26.1.0",
    "uvicorn==0.54.0",
]

[dependency-groups]
dev = [
    "httpx2==2.13.1",
    "mypy==2.3.1",
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "pytest-socket==0.8.1",
    "ruff==0.16.8",
    "shellcheck-py==0.11.0.1",
    "types-pyyaml==6.0.12.20260906",
]

[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.uv]
required-version = "==0.12.18"

[tool.ruff]
target-version = "py312"
line-length = 120
# Code blocks in Markdown documents are indicative (IX §57.6): ruff neither checks nor reformats them.
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["app"]
# The pydantic plugin gives mypy the real signature of the models, BaseSettings included (read from the environment).
plugins = ["pydantic.mypy"]

[tool.coverage.run]
# The SQLAlchemy listeners of the async engine run in greenlets.
concurrency = ["greenlet", "thread"]
# Also measure the subprocesses of the process-level tests (python -m app.worker, uvicorn).
patch = ["subprocess"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Network blocking for the whole session (VIII §50.1): only connections to 127.0.0.1 and ::1 are allowed;
# Unix sockets stay allowed. Coverage of app/ measured on every run, never blocking (VIII §49.2).
addopts = [
    "--allow-hosts=127.0.0.1,::1",
    "--allow-unix-socket",
    "--cov=app",
    "--cov-report=term-missing",
    "--strict-markers",
    # e2e tests run against the Compose stack, only through `scripts/radar-dev e2e` (and CI stage 6, T1.11).
    "-m",
    "not e2e",
]
# Catalogue traceability (VIII §50.3): `@pytest.mark.spec("T-DB-07")`, or with a part `spec("T-SEC-01:logs")`.
markers = [
    "spec(identifier): VIII §50.5 catalogue identifier covered by the test, optional part after ':'",
    "e2e: end-to-end test against the Compose stack (VIII §49.2 stage 6), deselected by default",
]
